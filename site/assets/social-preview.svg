<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1c1a12"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .pill rect { fill: #151b23; stroke: #3d444d; stroke-width: 1.5; }
      .pill text { fill: #e6edf3; font-size: 26px; font-weight: 500; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#bf8700"/>

  <g transform="translate(80 96) scale(2.25)">
    <path d="M32 3 57 11.5V30c0 15.2-10 25.6-25 31C17 55.6 7 45.2 7 30V11.5z" fill="#bf8700"/>
  <circle cx="32" cy="30" r="4.5" fill="#fff"/>
  <path d="M23 21a12.7 12.7 0 0 0 0 18M41 21a12.7 12.7 0 0 1 0 18M17 15a21 21 0 0 0 0 30M47 15a21 21 0 0 1 0 30" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <text x="256" y="172" fill="#ffffff" font-size="104" font-weight="700" letter-spacing="-2">vuln-digest</text>
  <text x="258" y="228" fill="#9198a1" font-size="38" font-weight="400">Scheduled vulnerability reports for AI agents</text>

  <text x="80" y="330" fill="#e6edf3" font-size="34" font-weight="400">Give this file to your AI assistant. It learns your stack and sends</text>
  <text x="80" y="376" fill="#e6edf3" font-size="34" font-weight="400">you only the vulnerabilities that matter, on your schedule.</text>

  <g class="pill" transform="translate(80 432)">
    <g><rect width="200" height="52" rx="26"/><text x="100" y="35" text-anchor="middle">Your stack</text></g>
    <g transform="translate(216 0)"><rect width="164" height="52" rx="26"/><text x="82" y="35" text-anchor="middle">Schedule</text></g>
    <g transform="translate(396 0)"><rect width="180" height="52" rx="26"/><text x="90" y="35" text-anchor="middle">No repeats</text></g>
    <g transform="translate(592 0)"><rect width="134" height="52" rx="26"/><text x="67" y="35" text-anchor="middle">Weekly</text></g>
    <g transform="translate(742 0)"><rect width="200" height="52" rx="26"/><text x="100" y="35" text-anchor="middle">Urgent alerts</text></g>
  </g>
  <g class="pill" transform="translate(80 500)">
    <g><rect width="160" height="52" rx="26"/><text x="80" y="35" text-anchor="middle">Zero Wire</text></g>
    <g transform="translate(176 0)"><rect width="140" height="52" rx="26"/><text x="70" y="35" text-anchor="middle">CISA KEV</text></g>
    <g transform="translate(332 0)"><rect width="90" height="52" rx="26"/><text x="45" y="35" text-anchor="middle">OSV</text></g>
    <g transform="translate(438 0)"><rect width="100" height="52" rx="26"/><text x="50" y="35" text-anchor="middle">EPSS</text></g>
    <g transform="translate(554 0)"><rect width="190" height="52" rx="26"/><text x="95" y="35" text-anchor="middle">What to do</text></g>
  </g>

  <text x="1120" y="590" fill="#d29922" font-size="30" font-weight="600" text-anchor="end">vuln-digest.secmy.app</text>
</svg>
